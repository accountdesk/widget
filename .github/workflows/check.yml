name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Keine ad-*-Namen (Werbeblocker)
        run: npm run check:adblock
      - run: npm ci
      - run: npm run build
